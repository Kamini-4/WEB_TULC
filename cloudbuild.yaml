# Google Cloud Build Pipeline
# Note: Google Cloud Run deployment has been decoupled in favor of Hostinger hosting (theunboundedleadership.com).
# This pipeline builds and validates the project cleanly on git pushes at $0 cost without triggering paid GCP services.

steps:
  # Step 1: Install dependencies
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['install']

  # Step 2: Build production frontend and assets
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['run', 'build']

options:
  logging: CLOUD_LOGGING_ONLY
