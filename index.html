    <title>The Unbounded Leadership Co. | Leadership Architecture</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/modern-normalize/2.0.0/modern-normalize.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@100..900&display=swap">
    <style>
        @charset "UTF-8";
        @import url("reset.css");
        @import url("theme.css");

        body {
            font-family: 'Playfair Display', serif;
        }

        /* Institutional Grain Texture */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.04;
            pointer-events: none;
            z-index: 9999;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3BaseFilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/baseFilter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .registry-card { transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
        .registry-card:hover { transform: translateY(-10px); background: rgba(255,255,255,0.02); }
        .registry-separator { height: 1px; width: 100%; background: rgba(255, 255, 255, 0.1); position: relative; overflow: hidden; }
        .registry-separator::after { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: #b8860b; transition: left 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        .registry-card:hover .registry-separator::after { left: 0; }
    </style>

        "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
      }
    }
    </script>
</head>
