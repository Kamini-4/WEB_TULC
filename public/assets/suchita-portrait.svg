<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 650" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Clean executive architectural study -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f2eb" />
      <stop offset="40%" stop-color="#ebe6dc" />
      <stop offset="100%" stop-color="#ded8cb" />
    </linearGradient>

    <!-- Warm Skin Gradients -->
    <linearGradient id="skinGrad" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#f7d4b9" />
      <stop offset="50%" stop-color="#eebf9e" />
      <stop offset="100%" stop-color="#dcad8c" />
    </linearGradient>
    <linearGradient id="skinShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c99776" />
      <stop offset="100%" stop-color="#b68263" />
    </linearGradient>

    <!-- Hair Gradient: Glossy espresso brown with rich waves -->
    <linearGradient id="hairGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#2a2220" />
      <stop offset="40%" stop-color="#191312" />
      <stop offset="80%" stop-color="#2f2320" />
      <stop offset="100%" stop-color="#140f0e" />
    </linearGradient>
    <linearGradient id="hairHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a3933" />
      <stop offset="50%" stop-color="#695147" />
      <stop offset="100%" stop-color="#3b2d28" />
    </linearGradient>

    <!-- Navy Vest Gradient -->
    <linearGradient id="navyVest" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#252a44" />
      <stop offset="50%" stop-color="#1d2035" />
      <stop offset="100%" stop-color="#131625" />
    </linearGradient>

    <!-- Gold Button Gradients -->
    <radialGradient id="goldButton" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fff2be" />
      <stop offset="35%" stop-color="#e5be5a" />
      <stop offset="70%" stop-color="#c29b35" />
      <stop offset="100%" stop-color="#7a5c18" />
    </radialGradient>

    <!-- White Shirt Gradient -->
    <linearGradient id="whiteShirt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="85%" stop-color="#f0ede6" />
      <stop offset="100%" stop-color="#dfd9cd" />
    </linearGradient>
  </defs>

  <!-- Modern Architectural Background (Warm Study with Vertical Cabinet Handles) -->
  <rect width="500" height="650" fill="url(#bgGrad)" />
  <!-- Cabinet vertical lines from photo -->
  <line x1="120" y1="0" x2="120" y2="400" stroke="#d5cebe" stroke-width="2" />
  <line x1="390" y1="0" x2="390" y2="380" stroke="#d5cebe" stroke-width="2" />
  <line x1="410" y1="0" x2="410" y2="380" stroke="#d5cebe" stroke-width="2" />
  <!-- Subtle dark vertical handles -->
  <rect x="388" y="140" width="4" height="45" rx="2" fill="#2c2a26" />
  <rect x="408" y="140" width="4" height="45" rx="2" fill="#2c2a26" />
  <!-- Recessed ceiling spotlight dot from photo -->
  <circle cx="230" cy="88" r="4.5" fill="#221e1a" />

  <!-- Back Hair Shadow Layer -->
  <path d="M 160 210 Q 130 320 120 440 Q 140 450 180 430 Q 190 320 200 250 Z" fill="#15100f" />
  <path d="M 330 220 Q 370 300 390 400 Q 370 410 340 380 Q 330 300 320 240 Z" fill="#15100f" />

  <!-- Body / White Shirt Base Layer -->
  <path d="M 100 650 L 110 460 Q 140 370 200 340 L 300 340 Q 360 370 390 460 L 400 650 Z" fill="url(#whiteShirt)" />
  <!-- Shirt Sleeves with Fabric Folds -->
  <path d="M 110 460 Q 130 520 160 590 L 115 650 L 80 650 L 95 490 Z" fill="#ffffff" stroke="#ded8cc" stroke-width="1.5" />
  <path d="M 390 460 Q 370 520 340 590 L 385 650 L 420 650 L 405 490 Z" fill="#ffffff" stroke="#ded8cc" stroke-width="1.5" />

  <!-- White Shirt Collar & V-Neck Detail -->
  <path d="M 210 340 L 180 410 L 225 385 L 245 425 L 255 425 L 275 385 L 320 410 L 290 340 Z" fill="#ffffff" stroke="#d5cebe" stroke-width="1.5" />
  <!-- Neck & Collar Shadow -->
  <path d="M 220 270 Q 220 350 250 375 Q 280 350 280 270 Z" fill="url(#skinShadow)" />
  <path d="M 224 260 Q 225 340 250 365 Q 275 340 276 260 Z" fill="url(#skinGrad)" />

  <!-- Tailored Navy Sweater Vest (with gold buttons & knit texture) -->
  <path d="M 175 390 
           L 155 460 
           Q 150 540 160 650 
           L 340 650 
           Q 350 540 345 460 
           L 325 390 
           L 278 410 
           L 255 440 
           L 245 440 
           L 222 410 Z" 
        fill="url(#navyVest)" 
        stroke="#101320" 
        stroke-width="1.5" />

  <!-- Vest Left and Right Chest Pocket Flaps from photo -->
  <rect x="180" y="475" width="46" height="34" rx="2" fill="#1c2033" stroke="#2b314d" stroke-width="1.5" />
  <rect x="274" y="475" width="46" height="34" rx="2" fill="#1c2033" stroke="#2b314d" stroke-width="1.5" />

  <!-- Two Prominent Embossed Gold Blazer Buttons from photo -->
  <!-- Top Gold Button -->
  <circle cx="250" cy="510" r="10" fill="url(#goldButton)" stroke="#684e12" stroke-width="1.5" filter="drop-shadow(0 2px 3px rgba(0,0,0,0.4))" />
  <circle cx="250" cy="510" r="7" fill="none" stroke="#fff5cf" stroke-width="1" opacity="0.7" />
  <circle cx="250" cy="510" r="3.5" fill="#9e7b23" />
  <!-- Bottom Gold Button -->
  <circle cx="250" cy="625" r="10" fill="url(#goldButton)" stroke="#684e12" stroke-width="1.5" filter="drop-shadow(0 2px 3px rgba(0,0,0,0.4))" />
  <circle cx="250" cy="625" r="7" fill="none" stroke="#fff5cf" stroke-width="1" opacity="0.7" />
  <circle cx="250" cy="625" r="3.5" fill="#9e7b23" />

  <!-- Hands Folded Gracefully In Front (from photo) -->
  <ellipse cx="250" cy="640" rx="60" ry="25" fill="url(#skinShadow)" />
  <ellipse cx="240" cy="635" rx="45" ry="20" fill="url(#skinGrad)" stroke="#c49777" stroke-width="1" />
  <ellipse cx="265" cy="642" rx="35" ry="16" fill="url(#skinGrad)" stroke="#c49777" stroke-width="1" />

  <!-- Head & Facial Features -->
  <!-- Jawline and Face Base -->
  <path d="M 195 190 
           C 190 250 205 315 250 315 
           C 295 315 310 250 305 190 
           C 300 135 200 135 195 190 Z" 
        fill="url(#skinGrad)" />

  <!-- Subtle Cheek Contour & Warm Blush -->
  <ellipse cx="218" cy="245" rx="16" ry="10" fill="#e89d82" opacity="0.25" />
  <ellipse cx="282" cy="245" rx="16" ry="10" fill="#e89d82" opacity="0.25" />

  <!-- Warm Kind Almond Eyes with Eyeliner (from photo) -->
  <!-- Left Eye -->
  <path d="M 214 208 Q 228 202 240 208 Q 228 215 214 208 Z" fill="#ffffff" />
  <ellipse cx="227" cy="208" rx="5.5" ry="5.5" fill="#3a251a" />
  <circle cx="227" cy="208" r="3" fill="#140c08" />
  <circle cx="229" cy="206" r="1.5" fill="#ffffff" />
  <path d="M 212 208 Q 228 200 242 207" stroke="#1d1512" stroke-width="2" fill="none" stroke-linecap="round" />
  <!-- Left Eyebrow -->
  <path d="M 210 197 Q 225 188 243 194" stroke="#251a16" stroke-width="2.5" fill="none" stroke-linecap="round" />

  <!-- Right Eye -->
  <path d="M 260 208 Q 272 202 286 208 Q 272 215 260 208 Z" fill="#ffffff" />
  <ellipse cx="273" cy="208" rx="5.5" ry="5.5" fill="#3a251a" />
  <circle cx="273" cy="208" r="3" fill="#140c08" />
  <circle cx="275" cy="206" r="1.5" fill="#ffffff" />
  <path d="M 258 207 Q 272 200 288 208" stroke="#1d1512" stroke-width="2" fill="none" stroke-linecap="round" />
  <!-- Right Eyebrow -->
  <path d="M 257 194 Q 275 188 290 197" stroke="#251a16" stroke-width="2.5" fill="none" stroke-linecap="round" />

  <!-- Soft Defined Nose -->
  <path d="M 248 208 L 246 242 Q 242 248 250 250 Q 258 248 254 242" stroke="#cb9b7a" stroke-width="1.8" fill="none" stroke-linecap="round" />
  <ellipse cx="243" cy="248" rx="2.5" ry="1.5" fill="#ba8868" />
  <ellipse cx="257" cy="248" rx="2.5" ry="1.5" fill="#ba8868" />

  <!-- Warm Reassuring Smile & Soft Mauve-Pink Lips (from photo) -->
  <path d="M 230 274 Q 250 271 270 274 Q 250 287 230 274 Z" fill="#be716e" />
  <path d="M 233 274 Q 250 273 267 274" stroke="#8c4442" stroke-width="1.5" fill="none" />
  <path d="M 235 274 Q 250 275 265 274 Q 250 283 235 274 Z" fill="#df8b87" />

  <!-- Small Gold Stud Earrings from photo -->
  <circle cx="198" cy="235" r="3" fill="url(#goldButton)" stroke="#80621b" stroke-width="0.8" />
  <circle cx="302" cy="235" r="3" fill="url(#goldButton)" stroke="#80621b" stroke-width="0.8" />

  <!-- Foreground Hair (Rich, voluminous espresso waves cascading over right shoulder) -->
  <!-- Hair Base Volume -->
  <path d="M 190 200 
           C 170 120 220 70 260 70 
           C 310 70 330 110 325 180 
           C 345 220 355 270 350 340 
           C 345 390 320 440 295 450 
           C 285 410 290 370 290 340 
           C 290 310 298 250 295 210 
           C 275 160 215 160 200 210 Z" 
        fill="url(#hairGrad)" />

  <!-- Left Cascading Wave (Sweeping right across chest, exactly as in photo) -->
  <path d="M 220 90 
           C 180 100 140 160 135 230 
           C 130 290 145 330 135 390 
           C 125 450 140 500 170 540 
           C 185 520 180 480 170 440 
           C 160 400 185 360 180 320 
           C 175 280 185 240 195 210 Z" 
        fill="url(#hairGrad)" />

  <!-- Layered Hair Waves & Highlighting Strands -->
  <path d="M 145 260 Q 130 330 145 400 Q 160 470 175 520" stroke="url(#hairHighlight)" stroke-width="3" fill="none" opacity="0.6" stroke-linecap="round" />
  <path d="M 155 230 Q 140 310 160 380 Q 175 440 180 490" stroke="url(#hairHighlight)" stroke-width="2.5" fill="none" opacity="0.5" stroke-linecap="round" />
  <path d="M 240 75 Q 210 95 185 140 Q 160 200 155 260" stroke="url(#hairHighlight)" stroke-width="3" fill="none" opacity="0.6" stroke-linecap="round" />
  <path d="M 280 85 Q 315 120 325 180 Q 335 250 330 320" stroke="url(#hairHighlight)" stroke-width="2.5" fill="none" opacity="0.5" stroke-linecap="round" />

  <!-- Subtle Executive Seal at bottom corner -->
  <g transform="translate(370, 560)">
    <circle cx="45" cy="45" r="32" fill="#17181c" stroke="#d4af37" stroke-width="2" />
    <circle cx="45" cy="45" r="28" fill="none" stroke="#9d7b38" stroke-dasharray="2 2" stroke-width="1" />
    <text x="45" y="42" font-family="serif" font-size="9" font-weight="bold" fill="#d4af37" text-anchor="middle" letter-spacing="1">TULC</text>
    <text x="45" y="52" font-family="monospace" font-size="5.5" font-weight="bold" fill="#f8f6f0" text-anchor="middle" letter-spacing="0.5">ARCHITECT</text>
  </g>
</svg>
